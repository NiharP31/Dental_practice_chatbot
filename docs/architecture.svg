<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 670" width="1000" height="670" role="img" aria-labelledby="t d">
<title id="t">Bright Smile Dental architecture</title>
<desc id="d">Chat UI to FastAPI /chat to the agent loop, which asks the LLM chain (Claude Haiku, falling back to Gemini Flash-Lite, then a canned reply) which tool to call, runs typed tools against Postgres, and passes every reply through guardrails before it reaches the patient. Emergencies write staff_alerts, shown on /staff.</desc>
