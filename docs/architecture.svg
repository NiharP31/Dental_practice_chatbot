    .e { stroke: #6e7681; }
    .ah { fill: #6e7681; }
    .dot { fill: #3fd1b4; }
    .dot2 { fill: #ff7b72; }
  }
  @media (prefers-reduced-motion: reduce) { .dot.moving, .dot2.moving, .dot3.moving, .hl { display: none; } }
</style>
