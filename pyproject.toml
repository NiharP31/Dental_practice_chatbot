[project]
name = "bright-smile-chatbot"
version = "0.1.0"
description = "Front-desk chatbot for Bright Smile Dental"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
    "google-genai>=2.33.0",
    "httpx>=0.28.1",
    "anthropic>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
timeout = 10
